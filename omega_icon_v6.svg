<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
<title>Omega-Plugin app icon: a guitar neck acting as the needle of a gauge</title>
<desc>A dark rounded tile. A thick orange gauge arc sweeps over the top, continuing dim grey past
the two-thirds mark. A simplified Stratocaster body sits at the pivot with its light neck rising up
and to the right like a needle.</desc>

<!-- Backing tile. The old icon was transparent with dark artwork, so it vanished against dark
     title bars and taskbars; a filled tile gives it a silhouette on any background. -->
<rect x="16" y="16" width="480" height="480" rx="108" fill="#1E2228"/>
<rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#3A414C" stroke-width="8"/>

<!-- Gauge. One continuous arc rather than thirteen separate ticks: at 16 px the ticks merged into
     a grey haze, whereas a solid band still reads as a gauge. -->
<path d="M344.17 188.65 A150 150 0 0 1 400.89 348.82" fill="none" stroke="#3A414C"
      stroke-width="30" stroke-linecap="round"/>
<path d="M111.11 348.82 A150 150 0 0 1 344.17 188.65" fill="none" stroke="#FF8A3D"
      stroke-width="30" stroke-linecap="round"/>

<!-- Guitar body, reduced to a silhouette aligned with the neck. -->
<g transform="translate(238.4,334.3) rotate(-54)">
  <rect x="-52" y="-44" width="104" height="88" rx="38" fill="#2C323B" stroke="#E6E9EF" stroke-width="10"/>
  <g fill="#14161A">
    <rect x="-30" y="-20" width="34" height="10" rx="5"/>
    <rect x="-30" y="-5" width="34" height="10" rx="5"/>
    <rect x="-30" y="10" width="34" height="10" rx="5"/>
  </g>
  <circle cx="30" cy="24" r="8" fill="#FF8A3D"/>
</g>

<!-- Neck as the needle. -->
<line x1="281.86" y1="274.40" x2="373.56" y2="148.20" stroke="#E6E9EF" stroke-width="26"
      stroke-linecap="round"/>

<!-- Headstock. -->
<g transform="translate(381.79,136.87) rotate(-54)">
  <rect x="-30" y="-24" width="60" height="48" rx="16" fill="#E6E9EF" stroke="#3A414C" stroke-width="6"/>
</g>
</svg>
