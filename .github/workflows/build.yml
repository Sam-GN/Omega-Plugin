# Compile and test on both targets.
#
# Linux is a shipping platform since 1.1.0, so its leg also packs and smoke-tests the AppImage: a
# packaging break is caught on the pull request rather than by a red release after the merge. Not
# one test needs an audio device, and none of them touches AWT, so neither leg needs a sound server
# or a display.
#
# ubuntu-22.04 rather than -latest for the same reason release.yml uses it: an AppImage runs against
# the host's glibc, so the image tested here should be built on the same floor as the one shipped.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      # fetch-depth: 0 for the version check below, which asks whether a tag already exists. The
      # default single-commit checkout fetches no tags, so every version would look unreleased.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # settings.gradle.kts has the foojay resolver, so the toolchain would be provisioned even
      # without this. Installing it here means the cache holds it rather than every run downloading
      # a JDK before it can start.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The same rule release.yml enforces, checked early enough to stop a merge rather than to
      # complain after one. Landing on main is releasing, so a change that does not bump the version
      # cannot be released, and a pull request that forgets is better caught here than by a red X on
      # main afterwards. Make this check required in branch protection and the merge button goes
      # grey until the version moves.
      #
      # Run on one OS only: the answer cannot differ between them, and the failure message should
      # appear once rather than twice.
      - name: Require the version to be unreleased
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ -z "$version" ]; then
            echo "::error::could not read the version from build.gradle.kts"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Bump the version in build.gradle.kts and add a CHANGELOG entry."
            exit 1
          fi
          echo "::notice::version v$version is unreleased - good"

      # bash on both, deliberately: gradlew is an sh script, .gitattributes pins it to LF, and Git
      # Bash is on the Windows runner. One command line rather than two that can drift apart.
      - name: Build and test
        shell: bash
        run: ./gradlew build --stacktrace

      # Pinned by version and checksum; the same pin is in release.yml, and the two change together.
      - name: Pack and smoke-test the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          ./gradlew appImage -Pappimagetool="$RUNNER_TEMP/appimagetool" --stacktrace
          image=$(ls build/distributions/Omega-Plugin-*-Linux.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --list-backends | tee report.txt
          grep -q "Collector: generational ZGC. Good." report.txt

      # For whoever wants to try a pull request on Linux without building it.
      - name: Keep the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/distributions/Omega-Plugin-*-Linux.AppImage
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/reports/tests/test
            build/test-results/test
