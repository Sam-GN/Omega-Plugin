# Publishes the artifacts a version stands for.
#
# The trigger is the `build` workflow finishing green on main — not a tag, and not the push itself:
# a release is only cut from a commit that has compiled and passed its tests on both Windows and
# Linux. The version in build.gradle.kts is then the only thing that decides whether a release
# happens: this reads it, and if no tag matches it yet, builds the bundle and publishes a draft
# release at tag `v<version>`. Merging your work is the whole ceremony — there is no separate tag
# to remember, and no way for a tag and a version to disagree, because only one of them is written
# by hand.
#
# A workflow_run job checks out the default branch's tip unless told otherwise, so the checkout
# below pins `head_sha`: the commit the build passed on is the commit that gets released, even if
# another push has landed since. workflow_dispatch still works for a manual run from a chosen ref.
#
# A push whose version is already released is a failure, deliberately. Every push to main is meant
# to be a release, so an unbumped version is a mistake rather than a quiet no-op, and it says so:
# "v1.0.65-beta is already released. Every push to main must bump the version." The alternative —
# skipping silently — hides a forgotten bump until somebody wonders where their release went.
#
# Note what this can and cannot do. A workflow runs *after* a push is accepted, so it cannot reject
# one; it fails the commit loudly. To make a *merge* impossible instead, require pull requests into
# main and make the `build` check required (Settings -> Branches -> branch protection). The same
# version check runs in build.yml on pull requests for exactly that reason.
#
# GPLv3 §6(d) is what publishing here has to discharge: a binary offered for download has to come
# with its Corresponding Source from the same place, and a GitHub release carries the tag's source
# archives beside the file attached below. Licences.SOURCE_URL points at this repository for the same reason, so the
# program itself can say where its source is.
#
# Two packaging jobs, because a jlink image is per-platform and so is everything built around one.
# The `.exe` can only come off a Windows runner — jpackage emits a native launcher for the machine it
# runs on — and needs no WiX, because it builds no installer: `--type app-image` is a folder with a
# launcher in it, not an `.msi`. The AppImage can only come off a Linux one, and specifically the
# *oldest* supported Ubuntu: an AppImage runs against the host's glibc, so it is promised to work on
# systems at least as new as the one that built it and no others. Building on ubuntu-latest would
# quietly drop every distribution a year or two older.
#
# Neither packaging job publishes. Each uploads its file, and `publish` attaches both to one draft,
# so a release never exists with one platform missing — if either packaging job fails, nothing is
# published at all.
name: release

on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession would otherwise race to create the same tag. Queue them instead of
# cancelling: a superseded run still has a version of its own worth publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Once, ahead of both platforms: the answer cannot differ between them.
  version:
    runs-on: ubuntu-latest
    # A failed or cancelled build also "completes" and fires this. Only a green one releases.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # fetch-depth: 0 because the version check below asks whether a tag exists, and the default
      # single-commit checkout fetches no tags at all — every version would look unreleased.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version and require it to be a new one
        id: version
        shell: bash
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ -z "$version" ]; then
            echo "::error::could not read the version from build.gradle.kts"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released. Every push to main must bump the version in build.gradle.kts and add a CHANGELOG entry."
            exit 1
          fi
          echo "::notice::releasing $tag"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and bundle
        shell: bash
        run: ./gradlew build exeZip --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/distributions/Omega-Plugin-*-Windows.zip
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            build/reports/tests/test
            build/test-results/test

  linux:
    needs: version
    # The glibc floor. See the note at the top of this file before changing it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Temurin specifically, not whatever the runner has: the bundled runtime's notice names the
      # exact build from its `release` file, and a distribution JDK's leaves that field out.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Pinned by version and by checksum. This is an executable fetched from the network and run
      # with the release's write token in scope; "continuous" would be a different binary every week.
      - name: Fetch appimagetool
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build, test and bundle
        shell: bash
        run: ./gradlew build appImage -Pappimagetool="$RUNNER_TEMP/appimagetool" --stacktrace

      # The cheapest proof the image is whole: it starts on a runner with no sound card and no
      # display, finds its own runtime, and runs the collector it was built for.
      - name: Smoke-test the AppImage
        shell: bash
        run: |
          image=$(ls build/distributions/Omega-Plugin-*-Linux.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --list-backends | tee report.txt
          grep -q "Collector: generational ZGC. Good." report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/distributions/Omega-Plugin-*-Linux.AppImage
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            build/reports/tests/test
            build/test-results/test

  publish:
    needs: [ version, windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # The tag does not exist yet; the action creates it at the commit both platforms built.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          draft: true
          generate_release_notes: true
          # One file per platform, deliberately. The audience is guitarists, not developers: a
          # release page offering a jar, loose launchers and several archives asks a musician to
          # understand the difference before they can play a note, and the wrong choice fails in a
          # way that reads as "the app is broken". Each of these needs nothing installed.
          #
          # Dropping the standalone LICENSE costs nothing under GPLv3: §4 wants the licence *with
          # the program*, and it is inside both (so is README.md, which carries the third-party
          # table and the source URL). §6(d) wants the source from the same place, and GitHub
          # attaches the tag's source archives to every release on its own.
          files: |
            dist/Omega-Plugin-*-Windows.zip
            dist/Omega-Plugin-*-Linux.AppImage
